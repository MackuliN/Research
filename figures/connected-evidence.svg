<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="figure-title figure-desc">
  <title id="figure-title">HAIP connected evidence layers</title>
  <desc id="figure-desc">Six connected layers: owner authority, bound knowledge, qualified resources, bounded action, independent verification, and retained disposition.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2; }
      .label { fill: #0f172a; font: 600 17px Arial, sans-serif; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <path class="arrow" d="M190 110 H210"/>
  <path class="arrow" d="M385 110 H405"/>
  <path class="arrow" d="M580 110 H600"/>
  <path class="arrow" d="M775 110 H795"/>
  <path class="arrow" d="M970 110 H990"/>

  <rect class="node" x="20" y="72" width="170" height="76" rx="10"/>
  <text class="label" x="105" y="105"><tspan x="105">Owner</tspan><tspan x="105" dy="22">authority</tspan></text>

  <rect class="node" x="215" y="72" width="170" height="76" rx="10"/>
  <text class="label" x="300" y="105"><tspan x="300">Bound</tspan><tspan x="300" dy="22">knowledge</tspan></text>

  <rect class="node" x="410" y="72" width="170" height="76" rx="10"/>
  <text class="label" x="495" y="105"><tspan x="495">Qualified</tspan><tspan x="495" dy="22">resources</tspan></text>

  <rect class="node" x="605" y="72" width="170" height="76" rx="10"/>
  <text class="label" x="690" y="105"><tspan x="690">Bounded</tspan><tspan x="690" dy="22">action</tspan></text>

  <rect class="node" x="800" y="72" width="170" height="76" rx="10"/>
  <text class="label" x="885" y="105"><tspan x="885">Independent</tspan><tspan x="885" dy="22">verification</tspan></text>

  <rect class="node" x="995" y="72" width="185" height="76" rx="10"/>
  <text class="label" x="1087.5" y="105"><tspan x="1087.5">Retained</tspan><tspan x="1087.5" dy="22">disposition</tspan></text>
</svg>
